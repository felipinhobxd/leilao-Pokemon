name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leilao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leilao_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and event validation
        run: npm run typecheck && npm test
      - name: Install WhatsApp bot dependencies
        run: npm --prefix bot ci --no-audit --no-fund
      - name: Validate WhatsApp bot syntax
        run: npm --prefix bot run check
      - name: Validate Windows service scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw bot/install-service.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw bot/uninstall-service.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw bot/run-service.ps1)) | Out-Null
      - name: Schema and functional database tests
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/whatsapp_bridge.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913042848_whatsapp_bot_runtime.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913043449_whatsapp_bot_command_requester_index.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913044443_whatsapp_group_sync_selection.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045744_auction_lot_increment_fields.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045753_auction_lot_number_sequence.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045801_auction_lot_number_constraints.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045807_auction_increment_constraint.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045819_auction_lot_edit_guard.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045826_card_images_bucket.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913045842_create_auction_wizard_rpc.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913050837_auction_lot_sequence_service_role_grant.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913052500_whatsapp_dispatch_delivery_stages.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913053833_whatsapp_dispatch_delivery_stages_noop_guard.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913173647_dashboard_snapshot_perf.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913180958_dashboard_snapshot.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913193000_whatsapp_participant_identities.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913202000_auction_publish_queues.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913202500_auction_queue_trigger_permissions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913202800_auction_queue_fk_indexes.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260913203200_auction_queue_actual_publish_deadline.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/participant-identities.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-wizard.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-queue.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-queue-runtime.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/dashboard-snapshot.sql
      - name: Concurrent buyouts and duplicate events
        run: python3 tests/concurrency.py
      - name: Build
        run: npm run build
      - name: Authenticated route guards
        run: node tests/smoke.mjs
