name: Card Recognition Local Benchmark Tools

on:
  push:
    branches:
      - feat/card-recognition-v10
    paths:
      - .github/workflows/card-recognition-local-tools.yml

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download Linux ONNX Runtime wheel for private local benchmark
        run: |
          mkdir wheels
          python -m pip download --only-binary=:all: --no-deps --dest wheels onnxruntime==1.22.1
      - uses: actions/upload-artifact@v4
        with:
          name: card-recognition-local-benchmark-tools
          path: wheels/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
