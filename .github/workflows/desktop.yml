name: Build Desktop App

on:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - ".github/workflows/desktop.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "app/**"
      - "lib/**"
      - "bot/**"
      - "scripts/**"
      - "supabase/**"
      - "public/**"
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Download portable Node.js 24 runtime for the packaged app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-runtime | Out-Null
          $url = "https://nodejs.org/dist/v24.21.0/win-x64/node.exe"
          Invoke-WebRequest -Uri $url -OutFile desktop-runtime/node.exe
          $version = & "$PWD\desktop-runtime\node.exe" --version
          Write-Host "Bundled Node runtime: $version"
          if ($version -ne "v24.21.0") { throw "Unexpected bundled Node version: $version" }

      - name: Build portable Next.js standalone
        run: node scripts/build-desktop.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RECOGNITION_SERVICE_SHARED_SECRET: ${{ secrets.RECOGNITION_SERVICE_SHARED_SECRET }}

      - name: Inject runtime environment for the embedded bot
        run: |
          @"
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          RECOGNITION_SERVICE_SHARED_SECRET=${{ secrets.RECOGNITION_SERVICE_SHARED_SECRET }}
          "@ | Out-File -FilePath bot/.env -Encoding utf8
        shell: pwsh

      - name: Install WhatsApp bot dependencies
        run: npm --prefix bot ci --no-audit --no-fund

      - name: Validate desktop entrypoints
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check electron/main.cjs
          node --check scripts/start-all.mjs
          node --check scripts/build-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unpacked app and Setup.exe
        run: npx electron-builder --win --publish never --config.directories.output=dist-electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate packaged resources
        shell: pwsh
        run: |
          $resources = Join-Path $PWD "dist-electron\win-unpacked\resources"
          $checks = @(
            (Join-Path $resources "app\.next\standalone\server.js"),
            (Join-Path $resources "app\scripts\start-all.mjs"),
            (Join-Path $resources "app\bot\service.mjs"),
            (Join-Path $resources "app\bot\node_modules\@supabase\supabase-js\package.json"),
            (Join-Path $resources "node\node.exe")
          )
          foreach ($file in $checks) {
            if (!(Test-Path $file)) { throw "Desktop package is missing required resource: $file" }
          }

          $nodeVersion = & (Join-Path $resources "node\node.exe") --version
          Write-Host "Bundled Node runtime: $nodeVersion"
          if ($nodeVersion -notmatch "^v2[2-9]\.") { throw "Desktop package requires bundled Node 22+; got $nodeVersion." }

      - name: Smoke-test the actual packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist-electron\win-unpacked\Leilão Pokémon.exe"
          if (!(Test-Path $exe)) { throw "Desktop executable not found: $exe" }

          $env:LEILAO_DESKTOP_SMOKE = "1"
          $env:LEILAO_DESKTOP_LOG_FILE = Join-Path $env:TEMP "leilao-pokemon-desktop-smoke.log"
          Remove-Item $env:LEILAO_DESKTOP_LOG_FILE -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -PassThru

          try {
            $healthOk = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($process.HasExited) {
                if (Test-Path $env:LEILAO_DESKTOP_LOG_FILE) { Get-Content $env:LEILAO_DESKTOP_LOG_FILE | Write-Host }
                throw "Desktop executable exited early with code $($process.ExitCode)."
              }
              try {
                $health = Invoke-WebRequest -Uri "http://127.0.0.1:3000/api/health" -UseBasicParsing -TimeoutSec 3
                if ($health.StatusCode -eq 200) {
                  $healthOk = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (!$healthOk) {
              if (Test-Path $env:LEILAO_DESKTOP_LOG_FILE) { Get-Content $env:LEILAO_DESKTOP_LOG_FILE | Write-Host }
              throw "Desktop smoke test failed: /api/health did not answer within 3 minutes."
            }

            $homepage = Invoke-WebRequest -Uri "http://127.0.0.1:3000/" -UseBasicParsing -TimeoutSec 10
            if ($homepage.StatusCode -ne 200) { throw "Desktop smoke test failed: homepage status $($homepage.StatusCode)." }
            if ($homepage.Content.Length -lt 1000) { throw "Desktop smoke test failed: homepage HTML is unexpectedly small." }
            if ($homepage.Content -notmatch "Leilão Pokémon") { throw "Desktop smoke test failed: expected app title was not found in homepage HTML." }

            Write-Host "Desktop smoke test OK: packaged .exe started Node 24, Next.js and served the application."
          } finally {
            if (Test-Path $env:LEILAO_DESKTOP_LOG_FILE) { Get-Content $env:LEILAO_DESKTOP_LOG_FILE | Write-Host }
            if (!$process.HasExited) {
              taskkill.exe /PID $process.Id /T /F | Out-Null
              Start-Sleep -Seconds 2
            }
          }

      - name: Upload installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
          tag_name: desktop-v${{ github.run_number }}
          name: Leilão Pokémon Desktop v${{ github.run_number }}
          body: |
            Instalador oficial do Leilão Pokémon para Windows x64.

            **Correção desta versão**
            - O painel Next.js já é compilado no GitHub Actions e fica empacotado no instalador.
            - O programa não executa `next build` na primeira abertura.
            - A janela de inicialização aparece imediatamente.
            - O CI abre o .exe real antes de publicar e verifica o `/api/health` e a página inicial.

            **Incluído**
            - Painel completo
            - Wizard de leilões
            - Central WhatsApp
            - Bot WhatsApp embutido
            - Reconhecimento de cartas pelo pipeline do navegador
            - Conexão direta com o mesmo Supabase do projeto

            **Primeiro uso**
            - Baixe o `.exe`
            - Instale normalmente
            - Abra o atalho "Leilão Pokémon"
            - Entre no painel com sua conta administrativa
            - Configure/conecte o WhatsApp pela Central WhatsApp

            O reconhecimento Python/IA local pesado continua opcional e não é baixado para dentro do instalador.
          draft: false
          prerelease: false
