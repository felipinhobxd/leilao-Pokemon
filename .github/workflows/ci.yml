name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leilao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leilao_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and event validation
        run: npm run typecheck && npm test
      - name: Install WhatsApp bot dependencies
        run: npm --prefix bot ci --no-audit --no-fund
      - name: Validate WhatsApp bot syntax
        run: npm --prefix bot run check
      - name: Validate Windows service scripts
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw bot/install-service.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw bot/uninstall-service.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw bot/run-service.ps1)) | Out-Null
      - name: Schema and functional database tests
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/whatsapp_bridge.sql
          # Apply every versioned migration in lexical/version order so
          # CI cannot silently drift behind production when a new migration
          # is added. Base schema/bootstrap are loaded above first.
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/participant-identities.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-warnings.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/warning-notice.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/quick-polls-reminders.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-drafts.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/giveaway-queue.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/edit-queue-item.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/delete-auction.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-wizard.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-queue.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-queue-runtime.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/auction-queue-scale.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/dashboard-snapshot.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/cleanup-retention.sql
      - name: Concurrent buyouts and duplicate events
        run: python3 tests/concurrency.py
      - name: Build
        run: npm run build
      - name: Authenticated route guards
        run: node tests/smoke.mjs

  windows-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Web and bot process lifecycle
        run: node --test tests/start-all.test.mjs
