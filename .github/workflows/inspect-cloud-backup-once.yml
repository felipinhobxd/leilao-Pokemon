name: Inspect Cloud Backup

on:
  push:
    paths:
      - ".github/workflows/inspect-cloud-backup-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install client
        run: npm ci --no-audit --no-fund
      - name: Inspect private backup counts only
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          const db = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SECRET_KEY, {
            auth: { persistSession: false, autoRefreshToken: false }
          });
          const { data: objects, error } = await db.storage.from("business-backups").list("backups", {
            limit: 100, sortBy: { column: "name", order: "desc" }
          });
          if (error) throw new Error(error.message);
          const backups = (objects ?? []).filter(o => /^backup-\d{8}-\d{4}\.json$/.test(o.name));
          console.log("BACKUP_COUNT", backups.length);
          for (const object of backups.slice(0, 7)) {
            const objectPath = "backups/" + object.name;
            const { data, error: downloadError } = await db.storage.from("business-backups").download(objectPath);
            if (downloadError) throw new Error(object.name + ": " + downloadError.message);
            const payload = JSON.parse(await data.text());
            const tables = payload.tables ?? {};
            const count = name => Array.isArray(tables[name]) ? tables[name].length : 0;
            console.log(JSON.stringify({
              name: object.name,
              exported_at: payload.exported_at,
              cards: count("cards"),
              auctions: count("auctions"),
              bids: count("bids"),
              purchases: count("purchases"),
              dispatches: count("whatsapp_dispatches"),
              queues: count("auction_publish_queues"),
              quick_polls: count("whatsapp_quick_polls"),
              participants: count("participants")
            }));
          }
          NODE
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
